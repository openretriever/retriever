name: CI

on:
  push:
    branches:
      - main
      # Release staging branches get full CI so they can be reviewed with
      # green checks before merging to main (release-branch-first flow).
      - release/**
      - docs/starlight-nova-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Public history guardrail
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          pixi run python scripts/release/check_public_history.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Core tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pixi run python -m pytest tests -q
      - name: Release readiness smoke
        run: pixi run p1-reliability-gates && pixi run p0-release-readiness-full
      - name: Docs build
        run: pixi run -e docs docs-build
      - name: Package build
        run: pixi run build

  recording-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rerun-sdk: ["0.23.4", "0.42.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install recording test dependencies
        run: >-
          python -m pip install -e '.[dev,recording]'
          'rerun-sdk==${{ matrix.rerun-sdk }}' pyarrow pandas opencv-python-headless dora-rs
      - name: Full suite with the pinned recording SDK
        env:
          RETRIEVER_TEST_RERUN_VERSION: ${{ matrix.rerun-sdk }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q
